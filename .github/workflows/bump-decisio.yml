# Opens a pull request that moves the site to decisio's latest release: the pin,
# the clips' record and posters, and every published command run again on the
# CPU stand-in. Daily, and on demand.
name: bump-decisio

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bump-decisio
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there a newer release?
        id: release
        run: |
          latest=$(gh api repos/aminry/decisio/releases/latest --jq .tag_name)
          pinned=$(jq -r .tag upstream.json)
          branch="bump/decisio-${latest}"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$pinned" ]; then
            echo "The site is on ${pinned}, the latest release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A pull request branch for ${latest} already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the release
        if: steps.release.outputs.skip == 'false'
        run: |
          tag='${{ steps.release.outputs.tag }}'
          commit=$(git ls-remote https://github.com/aminry/decisio "refs/tags/${tag}^{}" | cut -f1)
          [ -n "$commit" ] || commit=$(git ls-remote https://github.com/aminry/decisio "refs/tags/${tag}" | cut -f1)
          # The release's container image by digest, as its notes give it; the Docker guide shows it.
          image=$(gh release view "$tag" --repo aminry/decisio --json body --jq .body | grep -oE 'ghcr\.io/aminry/decisio@sha256:[0-9a-f]{64}' | head -1)
          [ -n "$image" ] || { echo "The release notes of ${tag} give no image digest"; exit 1; }
          jq --arg tag "$tag" --arg commit "$commit" --arg image "$image" '.tag = $tag | .commit = $commit | .image = $image' upstream.json > upstream.json.new
          mv upstream.json.new upstream.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.release.outputs.skip == 'false'
      - name: Install
        if: steps.release.outputs.skip == 'false'
        run: |
          npm ci
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Clips and posters
        if: steps.release.outputs.skip == 'false'
        run: npm run media

      - name: Run every published command on the CPU stand-in
        id: verify
        if: steps.release.outputs.skip == 'false'
        continue-on-error: true
        shell: bash
        run: node scripts/verify-commands.mjs 2>&1 | tee verify.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.release.outputs.skip == 'false'
        with:
          name: verify-log
          path: verify.log
          retention-days: 30

      - name: Run the integration checks on the CPU stand-in
        id: integrations
        if: always() && steps.release.outputs.skip == 'false' && steps.verify.outcome != 'cancelled'
        continue-on-error: true
        shell: bash
        run: node scripts/verify-integrations.mjs 2>&1 | tee integrations.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.release.outputs.skip == 'false'
        with:
          name: integrations-log
          path: integrations.log
          retention-days: 30

      - name: Commit through the API (signed by GitHub) and open the pull request
        if: always() && steps.release.outputs.skip == 'false' && steps.verify.outcome != 'cancelled'
        run: node scripts/open-bump-pr.mjs
        env:
          BUMP_TAG: ${{ steps.release.outputs.tag }}
          BUMP_BRANCH: ${{ steps.release.outputs.branch }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          INTEGRATIONS_OUTCOME: ${{ steps.integrations.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Start the checks on the pull request
        if: always() && steps.release.outputs.skip == 'false' && steps.verify.outcome != 'cancelled'
        run: gh workflow run ci.yml --ref '${{ steps.release.outputs.branch }}'
